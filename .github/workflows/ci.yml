# Gate rápido — structureCo
#
# Se ejecuta en cada push a main y en cada pull request. Comprueba documentación, lint,
# tipos, frontera matemática protegida, pruebas, build y presupuesto de rendimiento. No
# llama modelos de IA, automatiza navegadores, despliega, commitea, etiqueta ni publica.

name: Gate rápido

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. This workflow never needs to write to the repository, open issues,
# or touch packages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, frontera protegida, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node canónico
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Documentación canónica
        run: npm run verify:docs

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Frontera matemática protegida
        run: npm run verify:protected

      # Contrato de los PNG estructurales y del paquete que los agrupa. Corre sobre
      # el runner de pruebas de Node, no sobre vitest, asi que `npm test` no lo cubre.
      - name: Contrato de assets estructurales
        run: npm run verify:structural-assets

      - name: Pruebas deterministas
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Presupuestos de rendimiento
        run: npm run verify:perf

      - name: Chunk de entrada limpio
        run: npm run verify:entry

      # Las pruebas corren en Node, donde `require` existe: no pueden ver que el bundle
      # publicado lleve construcciones que sólo funcionan ahí. Este gate mira el artefacto.
      - name: Bundle del navegador sin código de Node
        run: npm run verify:browser-bundle

      # La politica de capacidad de Space 3D (150 nudos / 300 barras) se declara en
      # scripts/space3d-capacity-policy.mjs y hasta ahora no la comprobaba nadie.
      - name: Capacidad declarada de Space 3D
        run: npm run verify:space3d

      - name: Conservar el build en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-rapido-dist
          path: dist/
          retention-days: 5
          if-no-files-found: ignore
