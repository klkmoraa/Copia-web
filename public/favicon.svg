<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="structureCo">
  <!-- Icono de aplicación: la silueta redondeada del sistema, rellena del azul
       de acción, con la marca en blanco encima. El glifo es un pórtico —dos
       montantes, un dintel y el terreno— porque es la primera estructura que
       resuelve cualquiera que abra esta app, y porque a 16px sigue siendo
       reconocible: cuatro trazos y dos nudos, nada más. -->
  <rect width="64" height="64" rx="14.4" fill="#0071EB"/>
  <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 22h30"/>
    <path d="M20 22v22"/>
    <path d="M44 22v22"/>
    <path d="M13 47h38" stroke-width="3" opacity=".65"/>
  </g>
  <g fill="#fff">
    <circle cx="20" cy="22" r="4.6"/>
    <circle cx="44" cy="22" r="4.6"/>
  </g>
  <g fill="#0071EB">
    <circle cx="20" cy="22" r="1.9"/>
    <circle cx="44" cy="22" r="1.9"/>
  </g>
</svg>
